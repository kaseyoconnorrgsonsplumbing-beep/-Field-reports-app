[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify's "smart" secrets scanner false-positives on Firebase's own library
# files (they contain example "AIza..." keys). The Firebase web key is public by
# design; the only real secret (ANTHROPIC_API_KEY) never reaches the browser.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
